<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הזמנה - א.מ.ש</title>
<style>
:root{--gold:#c9a84c;--gold2:#e8c97a;--bg:#0f0f1a;--card:#16213e;--border:#2a3f60;--text:#f0ead6;--muted:#8a9bb5}
*{box-sizing:border-box}
html{min-height:-webkit-fill-available}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;min-height:-webkit-fill-available;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--card);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:2px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.4)}
header small{color:var(--gold);letter-spacing:3px} h1{margin:3px 0 0;font-size:24px}
.wrap{padding:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:7px}
.row span{flex:1;font-size:14px}
.q{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.q button,.q input{width:36px;height:34px;border:0;background:var(--bg);color:var(--text);text-align:center;font-size:16px}
.q button{color:var(--gold);font-size:20px;touch-action:manipulation}
.q input::-webkit-outer-spin-button,.q input::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{width:100%;min-height:70px;background:var(--card);color:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit;resize:none}
.warn{text-align:center;color:var(--gold2);font-weight:700;margin:12px 0}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--gold);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;box-shadow:0 -6px 20px rgba(0,0,0,.45)}
.send{width:auto;padding:0 18px;height:42px;border:0;background:#25D366;color:#fff;border-radius:10px;font-weight:700;font-size:15px}
#count{color:var(--gold);font-size:20px}
</style>
</head>
<body>
<header><small>✦ הזמנה ✦</small><h1>א.מ.ש</h1></header>
<div class="wrap" id="products"></div>
<div class="wrap"><textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div></div>
<footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer>
<script>
const PHONE='972544274897';
const PRODUCTS=['מרובע 25','מרובע 20','מרובע 15','ליפתניה מרובע 10','מרקיה מרובע 15','עגול 25','עגול 20','עגול 15','ליפתניה 10','מרקיה 15','סירה 14','סירה 16','סירה 18','קונוס 14','קונוס 16','קונוס 18','מלבן 11/16','מלבן 14/19','מלבן 16/24','מלבן 26/34','מלבן 27/37 ידיות','מגש 30/55','קערה סלט 24/31','מגש אובלי 25/35','מגש אובלי 36','קשים 8 מ״מ חום','קנו 20','קנו 30'];
const wrap=document.getElementById('products');
PRODUCTS.forEach(p=>{const r=document.createElement('div');r.className='row';const n=document.createElement('span');n.textContent=p;const q=document.createElement('div');q.className='q';const m=document.createElement('button');m.type='button';m.textContent='−';m.onclick=()=>chg(m,-1);const i=document.createElement('input');i.type='number';i.min='0';i.value='0';i.inputMode='numeric';i.setAttribute('pattern','[0-9]*');i.addEventListener('input',refresh);const b=document.createElement('button');b.type='button';b.textContent='+';b.onclick=()=>chg(b,1);q.append(m,i,b);r.append(n,q);wrap.appendChild(r)});
function chg(btn,d){const i=btn.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}
function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);document.getElementById('count').textContent=t}
function sendOrder(){const lines=['🛒 *הזמנה - א.מ.ש*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;document.querySelectorAll('.row').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){lines.push('• '+r.querySelector('span').textContent+': *'+q+'*');total+=q}});if(!total){alert('לא נבחרו פריטים');return}const n=document.getElementById('notes').value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(lines.join('\n'))}
</script>
</body>
</html>
